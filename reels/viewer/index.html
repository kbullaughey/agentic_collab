<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Viewer</title>
  <link rel="stylesheet" href="reel.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
  <div id="stage">
    <div id="map"></div>
    <div id="fade"></div>
    <aside id="panel">
      <header id="panel-head">
        <div id="clock"></div>
        <div id="scene"></div>
      </header>
      <div id="messages"></div>
    </aside>
    <div id="debug" hidden></div>
  </div>
  <div id="controls">
    <button id="play" title="Play/pause (space)">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
    <span id="tlabel">0.0s</span>
    <select id="speed" title="Playback speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <span id="segs"></span>
    <label><input id="dbg" type="checkbox"> debug (d)</label>
  </div>
  <script src="reel.js"></script>
</body>
</html>
