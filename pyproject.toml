[project]
name = "agentic-collab"
version = "0.1.0"
description = "Generative agents collaboratively mission-planning (evolution of Generative Agents / Smallville)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # LLM access + cost tracking
  "openai>=2.0",
  "openai-cost-logger>=0.4.1",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  # Backend simulation
  "numpy>=1.26",
  "paho-mqtt>=2.1",
  # Frontend (Django). The URLconf uses django.conf.urls.url, removed in Django 4.0.
  "Django>=2.2,<3.0",
  "django-cors-headers>=2.5,<3.0",
  "django-storages-redux==1.3.3",
  "boto>=2.49",
]

[dependency-groups]
dev = [
  "playwright>=1.63.0",
  "pylint>=3.2",
  "pytest>=9.1.1",
  "pyyaml>=6.0.3",
  "ruff>=0.6",
]
# Offline analysis scripts in utils/ and nlp/ (notebooks, plots, topic modeling).
analysis = [
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "nltk>=3.8",
  "gensim>=4.3",
  "spacy>=3.7",
  "ipykernel>=6.29",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
indent-width = 2
